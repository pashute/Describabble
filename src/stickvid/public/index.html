<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stickvid v0.1.47 - Stick Figure Animation Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .player-wrapper {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
        }

        .load-section {
            padding: 20px;
            background: #f9f9f9;
            border-bottom: 2px solid #ddd;
            display: flex;
            gap: 10px;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
        }

        .load-section button {
            padding: 12px 24px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            display: block;
            visibility: visible;
        }

        .load-section button:hover {
            background: #0056b3;
        }

        .load-section button:active {
            background: #003d82;
        }

        .load-section input[type="file"] {
            display: none;
        }

        .status {
            font-size: 14px;
            color: #666;
        }

        .canvas-container {
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 400px);
            max-height: 600px;
            min-height: 300px;
            border-bottom: 1px solid #ddd;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            height: auto;
            width: auto;
        }

        .controls-section {
            padding: 20px;
            background: #f9f9f9;
            position: relative;
            z-index: 10;
        }

        .play-controls {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .play-controls button {
            padding: 10px 14px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 18px;
            min-width: 50px;
            transition: background 0.2s;
        }

        .play-controls button:hover:not(:disabled) {
            background: #0056b3;
        }

        .play-controls button.play-pause-btn {
            background: #28a745;
            min-width: 60px;
            font-size: 20px;
        }

        .play-controls button.play-pause-btn:hover:not(:disabled) {
            background: #218838;
        }

        .play-controls button:disabled {
            background: #999;
            cursor: not-allowed;
            opacity: 0.7;
            color: #ddd;
        }

        .play-controls button:not(:disabled) {
            cursor: pointer;
            font-weight: bold;
        }

        .timeline-section {
            margin-bottom: 15px;
        }

        .timeline-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .timeline {
            flex: 1;
            height: 30px;
            background: #e9ecef;
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            border: 1px solid #ddd;
        }

        .timeline-progress {
            height: 100%;
            background: #007bff;
            border-radius: 3px;
            transition: width 0.05s linear;
        }

        .timeline-locator {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 20px;
            background: white;
            border: 2px solid #007bff;
            border-radius: 2px;
            cursor: grab;
            z-index: 10;
        }

        .timeline-locator:active {
            cursor: grabbing;
        }

        .time-display {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .time-input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .time-input-group label {
            font-size: 12px;
            color: #666;
            font-weight: bold;
        }

        .time-input-group input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: monospace;
            background: #f9f9f9;
            cursor: default;
            width: 100px;
        }

        .time-input-group input:focus {
            outline: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>stickvid v0.1.47 - Stick Figure Animation Player</h1>

        <div class="player-wrapper">
            <div class="load-section">
                <button id="loadBtn">Load .vid File</button>
                <input type="file" id="fileInput" accept=".vid">
                <span class="status" id="status">No movie loaded</span>
            </div>

            <div class="canvas-container">
                <div style="position: relative; width: 960px; height: 540px; background: #fff;">
                    <canvas id="animationCanvas" width="960" height="540"></canvas>
                </div>
            </div>

            <div class="controls-section">
                <div class="play-controls">
                    <button id="firstBtn" title="First frame" disabled>⏮</button>
                    <button id="prevBtn" title="Previous frame" disabled>⏪</button>
                    <button id="stopBtn" title="Stop" disabled>⏹</button>
                    <button id="playPauseBtn" class="play-pause-btn" title="Play" disabled>▶</button>
                    <button id="nextBtn" title="Next frame" disabled>⏩</button>
                    <button id="lastBtn" title="Last frame" disabled>⏭</button>
                </div>

                <div class="timeline-section">
                    <div class="timeline-wrapper">
                        <div class="timeline" id="timeline">
                            <div class="timeline-progress" id="timelineProgress"></div>
                            <div class="timeline-locator" id="timelineLocator"></div>
                        </div>
                    </div>

                    <div class="time-display">
                        <div class="time-input-group">
                            <label>Current Time</label>
                            <input type="text" id="currentTimeInput" readonly value="0:00">
                        </div>
                        <div class="time-input-group">
                            <label>Total Time</label>
                            <input type="text" id="totalTimeInput" readonly value="0:00">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script src="vid-loader.js"></script>
    <script src="player.js"></script>
</body>
</html>
